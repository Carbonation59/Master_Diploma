services:
  neo4j:
    image: neo4j:2026.02-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "apoc-extended", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - fdm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  architect-graph-service:
    build:
      context: ./architect-graph-service
      dockerfile: Dockerfile
    container_name: architect-graph-service
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password
      JAVA_OPTS: -Xmx512m -Xms256m
    ports:
      - "8083:8080"
    networks:
      - fdm-network
    restart: unless-stopped

  analysis-frontend:
    build:
      context: ./analysis-frontend
      dockerfile: Dockerfile
    container_name: analysis-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      API_URL: http://architect-graph-service:8080
      NEXT_PUBLIC_API_URL: http://localhost:8083
    networks:
      - fdm-network
    depends_on:
      - architect-graph-service

networks:
  fdm-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: